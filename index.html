<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Barva vmesnika brskalnika okoli strani. Ucinek ima na Chromu za
         Android in v Safariju, na namizju pa sele, ko je stran namescena kot
         aplikacija - trak z zavihki je vmesnik brskalnika in ga stran ne more
         prebarvati. Vrednosti sta isti kot ozadje strani v obeh temah, da rob
         med stranjo in brskalnikom izgine.

         Sledita sistemski nastavitvi in ne nastavitvi Tema v plosci: oznaka
         zna brati le medijsko poizvedbo, ne pa atributa, ki ga postavi JS. -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" />
    <title>Jure Blatnik</title>
    <link rel="icon" href="data:," />
    <style>
      /* =====================================================================
         DEFRACTED GLASS BY JURE
         Nastavitve dolocene v galaxy-lab.html:
           blur 8 px · nasicenost 2.05 · prosojnost 0.05
           lom 358 · sirina robu 0.65 · povecava 0.33
         ===================================================================== */
      :root {
        --ink: #e9edf3;
        --muted: #9aa5b3;
        --faint: #66707e;
        --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;

        /* Defracted Glass */
        --dg-blur: 8px;
        --dg-sat: 2.05;
        --dg-tint: rgba(30, 35, 44, 0.05);
        --dg-tint-strong: rgba(40, 46, 58, 0.16);

        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --spring: cubic-bezier(0.34, 1.45, 0.5, 1);
        --t-fast: 180ms;
        --t-med: 320ms;
        --t-slow: 560ms;
      }

      /* ---------------------------------------------------------------------
         SVETLA TEMA

         Galaksija je 50 000 tock z additivnim mesanjem: svetloba se sesteva,
         zato na beli podlagi zvezd sploh ni - vsaka bi svetlejsa od bele. Ne
         da se je "prebarvati" brez drugacnega izrisa.

         Zato je platno v svetli temi obrnjeno. Bele zvezde na crnini postanejo
         temne na belini, kar bere kot zvezdna karta s tusem. Obrat vrti tudi
         odtenke, zato ga popravimo nazaj s hue-rotate.

         Ostalo je zamenjava zetonov: barve so ze povsod imenovane.
      --------------------------------------------------------------------- */
      :root[data-tema="svetla"] {
        --ink: #14171d;
        --muted: #5b6472;
        --faint: #8b95a3;
        --dg-tint: rgba(255, 255, 255, 0.16);
        --dg-tint-strong: rgba(255, 255, 255, 0.4);
      }
      :root[data-tema="svetla"] body { background: #eef1f5; }
      :root[data-tema="svetla"] #galaxy {
        filter: invert(1) hue-rotate(180deg);
      }
      /* Na svetli podlagi mora sij ob robovih temneti, ne svetliti. */
      :root[data-tema="svetla"] .dg::before { mix-blend-mode: multiply; }
      :root[data-tema="svetla"] .dg {
        box-shadow:
          inset 0 9px 22px rgba(255, 255, 255, calc(0.5 + var(--glow, 0) * 0.3)),
          0 18px 50px rgba(20, 26, 38, 0.16);
      }

      /* ---------------------------------------------------------------------
         DRSNIK

         Sistemski drsnik je edini del vmesnika, ki ni nas. Pravega loma
         svetlobe mu ni mogoce dati - backdrop-filter na ::-webkit-scrollbar ne
         deluje, ker to niso elementi v dokumentu - zato je posnet z istimi
         sredstvi: prosojna podlaga, mlecno telo in svetel rob.
      --------------------------------------------------------------------- */
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
        background-color: rgba(255, 255, 255, 0.16);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
        transition: background-color var(--t-fast) var(--ease);
      }
      ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.3); }
      :root[data-tema="svetla"] ::-webkit-scrollbar-thumb {
        background-color: rgba(20, 26, 38, 0.2);
        box-shadow: inset 0 0 0 1px rgba(20, 26, 38, 0.12);
      }
      * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }

      * { box-sizing: border-box; }

      /* Izbrano besedilo. Privzeta modrina brskalnika je edina barva na
         strani, ki ni nasa - tu je namesto nje mlecna prosojnost, skozi
         katero se vidi galaksija, in ista pisava kot sicer. */
      ::selection {
        /* Ozadje risemo sami, glej selection.css - tam je mehkejse od tega,
           kar ::selection zmore. */
        background: transparent;
        color: var(--ink);
        text-shadow: none;
      }
      ::-moz-selection {
        background: transparent;
        color: var(--ink);
      }

      /* Nadzorne ploskve niso besedilo za branje; izbira na njih je nesreca
         pri vlecenju, ne namera. */
      button, .nav, .dock, .profil, .nast-glava, .prof-zavihki, .prof-stevci {
        -webkit-user-select: none;
        user-select: none;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: var(--font);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      #galaxy { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

      .dg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

      /* ---------------------------------------------------------------------
         DEFRACTED GLASS — snov
         Sij ob robovih NE pride iz border-color: ta je enakomeren po celem
         obodu in ne more biti mocnejsi na strani, kjer je kazalec. Namesto
         tega je obroc iz gradienta, izrezan z masko, ki se obraca za kazalcem.
      --------------------------------------------------------------------- */
      .dg {
        position: relative;
        background: var(--dg-tint);
        backdrop-filter: saturate(var(--dg-sat)) blur(var(--dg-blur)) url("#dg-refract");
        -webkit-backdrop-filter: saturate(var(--dg-sat)) blur(var(--dg-blur));
        border: none;
        box-shadow:
          inset 0 9px 22px rgba(255, 255, 255, calc(0.035 + var(--glow, 0) * 0.05)),
          inset 0 -9px 22px rgba(255, 255, 255, calc(0.022 + var(--glow, 0) * 0.035)),
          0 18px 50px rgba(0, 0, 0, 0.55);
        transition: background var(--t-fast) var(--ease), box-shadow var(--t-med) var(--ease);
      }

      /* Sij ob robovih. Debela ostra crta je videti kot obroba, ne kot
         svetloba; zato je obroc tanek in rahlo zabrisan, da prehod v steklo
         ni rob, ampak preliv. */
      .dg::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 0.9px;
        filter: blur(0.7px);
        background: linear-gradient(
          var(--glow-kot, 180deg),
          rgba(255, 255, 255, calc(0.2 + var(--glow, 0) * 0.34)) 0%,
          rgba(255, 255, 255, calc(0.08 + var(--glow, 0) * 0.13)) 18%,
          rgba(255, 255, 255, calc(0.03 + var(--glow, 0) * 0.04)) 50%,
          rgba(255, 255, 255, calc(0.06 + var(--glow, 0) * 0.1)) 82%,
          rgba(255, 255, 255, calc(0.16 + var(--glow, 0) * 0.26)) 100%
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* ---------------------------------------------------------------------
         MENI — kapsula
      --------------------------------------------------------------------- */
      .nav {
        position: fixed;
        top: max(34px, calc(env(safe-area-inset-top) + 18px));
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 7px;
        border-radius: 999px;

        /* Vstop: pripotuje iz globine - hkrati se spusti, poveca in izostri. */
        opacity: 0;
        animation: navVstop 720ms var(--spring) 320ms both;
      }

      @keyframes navVstop {
        from { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(0.94); filter: blur(12px); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); filter: blur(0); }
      }

      .nav button {
        font: inherit;
        font-size: 15px;
        color: var(--muted);
        background: none;
        border: none;
        padding: 11px 21px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background var(--t-fast) var(--ease),
          color var(--t-fast) var(--ease),
          transform var(--t-med) var(--spring);
      }
      .nav button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.06); }
      /* Squish: stisne se, ne dvigne. 0.955 - manj se ne cuti, vec je risanka. */
      .nav button:active { transform: scale(0.955); }

      .nav button[aria-selected="true"] {
        background: rgba(255, 255, 255, 0.13);
        color: var(--ink);
        font-weight: 600;
      }

      /* ---------------------------------------------------------------------
         PROFIL — zgoraj levo
         Zaprt je krog. Ob prehodu miske se razpre v desno in odkrije ime.
         Ime je ves cas v DOM in le odrezano, zato ni skoka ob prvem odprtju.
      --------------------------------------------------------------------- */
      .profil {
        position: fixed;
        top: max(34px, calc(env(safe-area-inset-top) + 18px));
        /* Odmik od roba je imenovan, ker ga odboj ob odpiranju potrebuje se
           enkrat - z njim sesteje svojih 7 px. */
        --odmik: max(34px, calc(env(safe-area-inset-left) + 18px));
        left: var(--odmik);
        z-index: 21;

        display: flex;
        align-items: center;
        gap: 0;
        padding: 6px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font: inherit;
        color: var(--ink);
        text-align: left;
        overflow: hidden;

        /* Mere in lego animiramo, ne transform. Skaliranje bi raztegnilo tudi
           sliko in besedilo, transform pa je tu ze zaseden: magnetni ucinek
           ga pise neposredno v slog ob vsakem premiku miske in bi vsak
           transform iz stilske datoteke preglasil. */
        width: 46px;
        height: 46px;
        transition:
          width 520ms var(--spring),
          height 520ms var(--spring),
          left 520ms var(--spring);

        opacity: 0;
        animation: profilVstop 720ms var(--spring) 200ms both;
      }

      @keyframes profilVstop {
        from { opacity: 0; transform: translateX(-14px) scale(0.94); filter: blur(12px); }
        to   { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
      }

      /* Vstopna animacija ima fill: both, zato tudi po koncu drzi transform in
         preglasi vsakega iz sloga - odboj ob odpiranju in stisk ob pritisku ne
         bi delovala. Ko odigra, jo JS odvzame; opacity je treba postaviti
         nazaj, ker jo je do tedaj drzala animacija. */
      .profil.vstopil { animation: none; opacity: 1; }

      /* Odpiranje: kapsula se ne le raztegne v desno, ampak se odrine od leve.
         Vzmet v prehodu odnese odmik cez 7 px in ga vrne, zato je videti kot
         odboj in ne kot risanje pravokotnika v desno. */
      .profil:hover,
      .profil:focus-visible {
        width: 178px;
        height: 52px;
        left: calc(var(--odmik) + 7px);
      }
      .profil:active { transform: scale(0.97); }

      /* Sij ob robovih mora ostati nad sliko. ::before je prvi otrok, zato bi
         ga slika, ki pride za njim, sicer pokrila. */
      .profil::before { z-index: 2; }

      /* Slika ni vec krog, ki bi ob odpiranju izginil, ampak podlaga kapsule.
         Odmaknjena je 6 px od roba, torej je natanko tolika kot notranjost
         kapsule - in ker se siri kapsula, se siri z njo. Zato tu ni nobene
         animacije velikosti: krog se raztegne v kapsulo sam od sebe.
         999 px zaokrozitve je krog, dokler je polje kvadratno, in kapsula,
         ko se raztegne. */
      .profil-slika {
        position: absolute;
        inset: 6px;
        z-index: 0;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      .profil-slika img {
        /* Glej opombo o HDR v profile.css - ista slika, isti razlog. */
        dynamic-range-limit: standard;
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; object-position: 50% 38%;
        display: block;
        transition:
          filter 420ms var(--ease),
          transform 520ms var(--spring);
      }
      /* Odprta kapsula: slika stopi v ozadje, da ime pride v ospredje.

         Blur in zatemnitev sta na sliki in ne na ovoju: ovoj sliko obrezuje,
         zabrisati ovoj bi pomenilo zabrisati ze obrezan rob in ta bi se
         razlil. Rahla povecava potisne zabrisani rob pod masko. */
      .profil:hover .profil-slika img,
      .profil:focus-visible .profil-slika img {
        filter: blur(2.4px) brightness(0.42) saturate(0.85);
        transform: scale(1.14);
      }

      .profil-ime {
        position: absolute;
        left: 17px;
        top: 50%;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        white-space: nowrap;
        opacity: 0;
        /* Pride sele, ko se je slika ze umaknila v ozadje in je prostor odprt. */
        transform: translateY(-50%) translateX(-10px) scale(0.96);
        filter: blur(6px);
        transition:
          opacity 300ms var(--ease) 150ms,
          filter 340ms var(--ease) 150ms,
          transform 420ms var(--spring) 150ms;
      }
      .profil:hover .profil-ime,
      .profil:focus-visible .profil-ime {
        opacity: 1;
        filter: blur(0);
        transform: translateY(-50%) translateX(0) scale(1);
      }

      /* Ime stoji na zatemnjeni fotografiji in ne na steklu, zato barva ne
         pride iz zetonov teme. V svetli temi je --ink temen in ime bi na
         temni sliki izginilo; fotografija se s temo ne obrne. */
      .profil-ime-vrh {
        font-size: 14px;
        font-weight: 700;
        /* Pri debeli pisavi se crke zlepijo; rahlo negativen razmik jih drzi
           skupaj kot besedo in ne kot niz znakov. */
        letter-spacing: -0.012em;
        line-height: 1.1;
        color: #f2f5fa;
      }
      .profil-ime-rocaj {
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.012em;
        line-height: 1.1;
        color: rgba(242, 245, 250, 0.72);
      }

      .nav-profile {
        flex: none;
        position: relative;
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 50%;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
        cursor: pointer;
        border: none;
        transition: transform var(--t-med) var(--spring), box-shadow var(--t-fast) var(--ease);
      }
      .nav-profile img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover; object-position: 50% 38%;
        display: block;
      }
      .nav-profile:hover { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2); }
      .nav-profile:active { transform: scale(0.93); }

      .nav-sep {
        flex: none;
        width: 1px;
        align-self: stretch;
        margin: 6px 8px;
        background: rgba(255, 255, 255, 0.12);
      }

      /* ---------------------------------------------------------------------
         ORODJA — kapsula spodaj desno
         Odmik je isti kot pri zgornji vrstici, zato oba robova "dihata" enako.
      --------------------------------------------------------------------- */
      .dock {
        position: fixed;
        right: max(34px, calc(env(safe-area-inset-right) + 18px));
        bottom: max(34px, calc(env(safe-area-inset-bottom) + 18px));
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 7px;
        border-radius: 999px;

        opacity: 0;
        animation: dockVstop 720ms var(--spring) 440ms both;
      }

      @keyframes dockVstop {
        from { opacity: 0; transform: translateY(16px) scale(0.94); filter: blur(12px); }
        to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }

      .dock-icon {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        padding: 0;
        color: var(--muted);
        background: none;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        transition:
          background var(--t-fast) var(--ease),
          color var(--t-fast) var(--ease),
          transform var(--t-med) var(--spring);
      }
      .dock-icon svg { width: 21px; height: 21px; display: block; }
      .dock-icon:hover { color: var(--ink); background: rgba(255, 255, 255, 0.06); }
      .dock-icon:active { transform: scale(0.93); }

      /* Bouncy squish ob prehodu miske - dodaja ga JS in odstrani ob koncu. */
      @keyframes squish {
        0% { transform: scale(1); }
        42% { transform: scale(0.966); }
        100% { transform: scale(1); }
      }
      .squish { animation: squish 340ms var(--spring); }

      @keyframes pop {
        0%, 100% { transform: none; }
        45% { transform: scale(1.035); }
      }
      .pop { animation: pop 300ms var(--spring); }


      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Lom svetlobe ob robovih. Karto premikov narise cv.js. -->
    <svg class="dg-defs" aria-hidden="true" width="0" height="0">
      <filter id="dg-refract" x="-20%" y="-20%" width="140%" height="140%"
              color-interpolation-filters="sRGB">
        <feImage id="dg-map" result="mapa" preserveAspectRatio="none" />
        <feDisplacementMap id="dg-disp" in="SourceGraphic" in2="mapa"
                           scale="358" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <canvas id="galaxy"></canvas>

    <!-- Profil je svoj gumb zgoraj levo, enako dalec od obeh robov kot je
         zgornja vrstica od vrha. Ob prehodu miske se razsiri v desno. -->
    <button class="profil dg" type="button" aria-label="Profil">
      <span class="profil-slika"><img id="nav-avatar" alt="" /></span>
      <span class="profil-ime">
        <span class="profil-ime-vrh">Jureb</span>
        <span class="profil-ime-rocaj">@blatnikjuree</span>
      </span>
    </button>

    <nav class="nav dg" role="tablist" aria-label="Glavni meni">
      <button type="button" role="tab" aria-selected="true">Arhiv</button>
      <button type="button" role="tab" aria-selected="false">Delo</button>
      <button type="button" role="tab" aria-selected="false">O meni</button>
      <button type="button" role="tab" aria-selected="false">Stik</button>
    </nav>

    <!-- Iskanje in nastavitve zivita spodaj desno, enako dalec od obeh robov
         kot je zgornja vrstica od svojega. -->
